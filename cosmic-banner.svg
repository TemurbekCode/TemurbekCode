<svg width="100%" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cosmic orbit banner</title>
<desc>Animated deep-space scene: a glowing sun with five orbiting planets of varying size and shading, one ringed, one with a moon, an asteroid belt, drifting nebula clouds, twinkling stars and a periodic comet</desc>
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
    <stop offset="0%" stop-color="#10151f"/>
    <stop offset="100%" stop-color="#05070c"/>
  </radialGradient>
  <radialGradient id="sunGrad" cx="42%" cy="38%" r="65%">
    <stop offset="0%" stop-color="#fffaf0"/>
    <stop offset="35%" stop-color="#ffd76b"/>
    <stop offset="100%" stop-color="#ff8a2b"/>
  </radialGradient>
  <radialGradient id="p1Grad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#d9c9b8"/>
    <stop offset="100%" stop-color="#7a5c46"/>
  </radialGradient>
  <radialGradient id="p2Grad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#bdf0d8"/>
    <stop offset="55%" stop-color="#4fb0a0"/>
    <stop offset="100%" stop-color="#1f6f6a"/>
  </radialGradient>
  <radialGradient id="p3Grad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ffd9a0"/>
    <stop offset="100%" stop-color="#c1651f"/>
  </radialGradient>
  <radialGradient id="p4Grad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ffe9c2"/>
    <stop offset="55%" stop-color="#e0a95c"/>
    <stop offset="100%" stop-color="#a06a2c"/>
  </radialGradient>
  <radialGradient id="p5Grad" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#cfe8ff"/>
    <stop offset="60%" stop-color="#7fb4e8"/>
    <stop offset="100%" stop-color="#3a5f9a"/>
  </radialGradient>
  <linearGradient id="cometGrad" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity=".95"/>
  </linearGradient>
  <path id="orb1" d="M390,140 A60,16 0 1,0 510,140 A60,16 0 1,0 390,140"/>
  <path id="orb2" d="M350,140 A100,26 0 1,0 550,140 A100,26 0 1,0 350,140"/>
  <path id="orb3" d="M300,140 A150,38 0 1,0 600,140 A150,38 0 1,0 300,140"/>
  <path id="orb4" d="M240,140 A210,52 0 1,0 660,140 A210,52 0 1,0 240,140"/>
  <path id="orb5" d="M170,140 A280,66 0 1,0 730,140 A280,66 0 1,0 170,140"/>
  <path id="moonOrbit" d="M-15,0 A15,5 0 1,0 15,0 A15,5 0 1,0 -15,0"/>
</defs>
<style>
  .star{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .roid{animation:tw2 5s ease-in-out infinite}
  @keyframes tw2{0%,100%{opacity:.3}50%{opacity:.8}}
  .drift{animation:drift 30s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(15px,-8px)}}
</style>

<rect x="0" y="0" width="900" height="240" fill="url(#bgGrad)"/>

<g class="drift">
  <ellipse cx="140" cy="70" rx="160" ry="65" fill="#6b4fa0" opacity=".08"/>
  <ellipse cx="760" cy="185" rx="170" ry="75" fill="#3a7bd5" opacity=".07"/>
  <ellipse cx="620" cy="45" rx="130" ry="45" fill="#c05fc0" opacity=".05"/>
  <ellipse cx="80" cy="190" rx="120" ry="50" fill="#3aa0c0" opacity=".06"/>
</g>

<circle class="star" cx="45" cy="30" r="1.3" fill="#e6edf3"/>
<circle class="star" cx="110" cy="70" r="1" fill="#e6edf3" style="animation-delay:.3s"/>
<circle class="star" cx="820" cy="35" r="1.4" fill="#e6edf3" style="animation-delay:.6s"/>
<circle class="star" cx="30" cy="150" r="1" fill="#e6edf3" style="animation-delay:.9s"/>
<circle class="star" cx="860" cy="170" r="1.3" fill="#e6edf3" style="animation-delay:1.2s"/>
<circle class="star" cx="200" cy="25" r="1" fill="#e6edf3" style="animation-delay:1.5s"/>
<circle class="star" cx="700" cy="215" r="1" fill="#e6edf3" style="animation-delay:1.8s"/>
<circle class="star" cx="60" cy="215" r="1.3" fill="#e6edf3" style="animation-delay:2.1s"/>
<circle class="star" cx="470" cy="15" r="1" fill="#e6edf3" style="animation-delay:.4s"/>
<circle class="star" cx="850" cy="100" r="1" fill="#e6edf3" style="animation-delay:1.1s"/>
<circle class="star" cx="20" cy="90" r="1" fill="#e6edf3" style="animation-delay:1.7s"/>
<circle class="star" cx="880" cy="55" r="1.2" fill="#e6edf3" style="animation-delay:2.3s"/>
<circle class="star" cx="330" cy="20" r="1" fill="#e6edf3" style="animation-delay:2.6s"/>
<circle class="star" cx="580" cy="225" r="1" fill="#e6edf3" style="animation-delay:.7s"/>
<circle class="star" cx="410" cy="215" r="1" fill="#e6edf3" style="animation-delay:1.4s"/>
<circle class="star" cx="760" cy="20" r="1.1" fill="#e6edf3" style="animation-delay:2s"/>
<g class="star" style="animation-delay:.5s">
  <rect x="668" y="88" width="9" height="1" fill="#fff"/>
  <rect x="672" y="84" width="1" height="9" fill="#fff"/>
</g>
<g class="star" style="animation-delay:1.9s">
  <rect x="128" y="128" width="8" height="1" fill="#fff"/>
  <rect x="131.5" y="124.5" width="1" height="8" fill="#fff"/>
</g>
<g class="star" style="animation-delay:2.9s">
  <rect x="748" y="150" width="7" height="1" fill="#fff"/>
  <rect x="751" y="147" width="1" height="7" fill="#fff"/>
</g>

<use href="#orb1" fill="none" stroke="#3a4150" stroke-width=".5" stroke-dasharray="2 3"/>
<use href="#orb2" fill="none" stroke="#3a4150" stroke-width=".5" stroke-dasharray="2 3"/>
<use href="#orb3" fill="none" stroke="#3a4150" stroke-width=".5" stroke-dasharray="2 3"/>
<use href="#orb4" fill="none" stroke="#3a4150" stroke-width=".5" stroke-dasharray="2 3"/>
<use href="#orb5" fill="none" stroke="#3a4150" stroke-width=".5" stroke-dasharray="2 3"/>

<circle class="roid" cx="630" cy="140" r="1.3" fill="#8b949e"/>
<circle class="roid" cx="606" cy="163" r="1" fill="#8b949e" style="animation-delay:.4s"/>
<circle class="roid" cx="540" cy="180" r="1.2" fill="#8b949e" style="animation-delay:.8s"/>
<circle class="roid" cx="450" cy="186" r="1" fill="#8b949e" style="animation-delay:1.2s"/>
<circle class="roid" cx="360" cy="180" r="1.3" fill="#8b949e" style="animation-delay:1.6s"/>
<circle class="roid" cx="294" cy="163" r="1" fill="#8b949e" style="animation-delay:2s"/>
<circle class="roid" cx="270" cy="140" r="1.2" fill="#8b949e" style="animation-delay:2.4s"/>
<circle class="roid" cx="294" cy="117" r="1" fill="#8b949e" style="animation-delay:2.8s"/>
<circle class="roid" cx="360" cy="100" r="1.3" fill="#8b949e" style="animation-delay:.6s"/>
<circle class="roid" cx="450" cy="94" r="1" fill="#8b949e" style="animation-delay:1s"/>
<circle class="roid" cx="540" cy="100" r="1.2" fill="#8b949e" style="animation-delay:1.4s"/>
<circle class="roid" cx="606" cy="117" r="1" fill="#8b949e" style="animation-delay:1.8s"/>

<circle cx="450" cy="140" r="48" fill="#ff9838" opacity=".05"/>
<circle cx="450" cy="140" r="32" fill="#ff9838" opacity=".1"/>
<circle cx="450" cy="140" r="19" fill="url(#sunGrad)"/>

<g>
  <circle r="4" fill="url(#p1Grad)"/>
  <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#orb1"/></animateMotion>
</g>

<g>
  <circle r="6" fill="url(#p2Grad)"/>
  <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orb2"/></animateMotion>
</g>

<g>
  <circle r="7" fill="url(#p3Grad)"/>
  <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orb3"/></animateMotion>
</g>

<g>
  <g transform="rotate(-18)">
    <ellipse cx="0" cy="0" rx="21" ry="5.5" fill="none" stroke="#d8c090" stroke-width="2" opacity=".85"/>
    <ellipse cx="0" cy="0" rx="21" ry="5.5" fill="none" stroke="#a8895a" stroke-width=".6" opacity=".6"/>
  </g>
  <circle r="10" fill="url(#p4Grad)"/>
  <animateMotion dur="20s" repeatCount="indefinite"><mpath href="#orb4"/></animateMotion>
</g>

<g>
  <circle r="8" fill="url(#p5Grad)"/>
  <g>
    <circle r="2.2" fill="#cfd6e0"/>
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#moonOrbit"/></animateMotion>
  </g>
  <animateMotion dur="28s" repeatCount="indefinite"><mpath href="#orb5"/></animateMotion>
</g>

<g opacity="0">
  <circle r="1.6" fill="#fff" opacity=".5"/>
  <circle cx="-6" cy="4" r="1.1" fill="#fff" opacity=".3"/>
  <circle cx="-11" cy="7" r=".8" fill="#fff" opacity=".18"/>
  <line x1="0" y1="0" x2="16" y2="-10" stroke="url(#cometGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <animateMotion path="M950,-30 L250,300" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.35;.38" dur="9s" repeatCount="indefinite"/>
</g>

</svg>
